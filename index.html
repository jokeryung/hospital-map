<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>醫護支援人員護理技巧與醫院聯網綜合溫習系統</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1329;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #152243 0%, #0b1329 100%);
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
    }

    .app-wrapper {
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    }

    /* Header (Moved down closer to the cards as requested) */
    header {
      text-align: center;
      margin-bottom: 22px;
      flex-shrink: 0;
    }

    .badge-top {
      display: inline-block;
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: 1px solid rgba(59, 130, 246, 0.35);
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      line-height: 1.25;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* 3 Action Buttons Container */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .nav-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-radius: 18px;
      text-decoration: none;
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.35);
      border: 1.5px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .nav-card:active {
      transform: scale(0.98);
      filter: brightness(0.92);
    }

    .nav-card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 1;
    }

    .card-tag {
      display: inline-block;
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 900;
      line-height: 1.25;
      color: #ffffff;
    }

    .card-meta {
      font-size: 0.83rem;
      line-height: 1.3;
      font-weight: 500;
    }

    .card-arrow {
      font-size: 1.45rem;
      font-weight: 900;
      color: #ffffff;
      padding-left: 12px;
      z-index: 1;
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }

    .nav-card:hover .card-arrow {
      transform: translateX(4px);
    }

    /* Button 1: Map (Blue) */
    .card-map {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      border-color: #3b82f6;
    }
    .card-map .card-tag {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }
    .card-map .card-meta {
      color: #bfdbfe;
    }

    /* Button 2: Simple Quiz (NOW GREEN / TEAL - Swapped) */
    .card-simple {
      background: linear-gradient(135deg, #064e3b 0%, #0d9488 100%);
      border-color: #14b8a6;
    }
    .card-simple .card-tag {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }
    .card-simple .card-meta {
      color: #ccfbf1;
    }

    /* Button 3: Enhanced Pro Quiz (NOW AMBER / ORANGE - Swapped) */
    .card-pro {
      background: linear-gradient(135deg, #78350f 0%, #d97706 100%);
      border-color: #f59e0b;
    }
    .card-pro .card-tag {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }
    .card-pro .card-meta {
      color: #fef3c7;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 6px 0;
      font-size: 0.74rem;
      color: #64748b;
      flex-shrink: 0;
    }

    /* Responsive adjustments for shorter mobile viewports */
    @media (max-height: 700px) {
      .app-wrapper {
        padding: 14px 16px;
      }
      header {
        margin-bottom: 14px;
      }
      h1 {
        font-size: 1.25rem;
      }
      .badge-top {
        font-size: 0.72rem;
        margin-bottom: 5px;
        padding: 2px 10px;
      }
      .button-group {
        gap: 10px;
        margin-bottom: 14px;
      }
      .nav-card {
        padding: 14px 18px;
        border-radius: 14px;
      }
      .card-title {
        font-size: 1.1rem;
      }
      .card-meta {
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">

    <!-- Header (Comfortably centered closer to buttons) -->
    <header>
      <div class="badge-top">ERB 醫護支援人員護理技巧 I 基礎證書</div>
      <h1>綜合溫習與測驗系統</h1>
      <p class="subtitle">請直接點擊以下按鈕進入對應溫習模組</p>
    </header>

    <!-- 3 Big Direct Navigation Cards (Zero Scroll on Mobile) -->
    <div class="button-group">

      <!-- Button 1: Map (Blue) -->
      <a href="map.html" class="nav-card card-map">
        <div class="nav-card-info">
          <span class="card-tag">地理分佈 ｜ 聯網速查</span>
          <div class="card-title">醫院聯網分佈地圖</div>
          <div class="card-meta">全港 7 大醫院聯網 ｜ 43 間公立機構互動定位</div>
        </div>
        <div class="card-arrow">→</div>
      </a>

      <!-- Button 2: Simple Quiz (Green / Teal) -->
      <a href="quiz.html" class="nav-card card-simple">
        <div class="nav-card-info">
          <span class="card-tag">快速熱身 ｜ 20 題速測</span>
          <div class="card-title">簡單測驗 (基礎版)</div>
          <div class="card-meta">精選 100 題題庫 ｜ 每次隨機 20 題即時批改</div>
        </div>
        <div class="card-arrow">→</div>
      </a>

      <!-- Button 3: Enhanced Quiz (Amber / Orange) -->
      <a href="quiz_pro.html" class="nav-card card-pro">
        <div class="nav-card-info">
          <span class="card-tag">全面考核 ｜ 實戰模擬</span>
          <div class="card-title">加強版測驗 (全題庫)</div>
          <div class="card-meta">1000 題紅框 MC ｜ 6 大綠框短答 ｜ 正式考試模式</div>
        </div>
        <div class="card-arrow">→</div>
      </a>

    </div>

    <!-- Footer -->
    <footer>
      醫護支援人員 (PCA) 課程筆記 ｜ 嚴格核對講義重點編製
    </footer>

  </div>

</body>
</html>
