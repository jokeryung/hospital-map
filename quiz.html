<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>醫護支援人員護理技巧綜合溫習系統 (20 題 MC 測驗)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --teal: #0f766e;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
      --correct-bg: #ecfdf5;
      --correct-border: #10b981;
      --correct-text: #065f46;
      --wrong-bg: #fef2f2;
      --wrong-border: #ef4444;
      --wrong-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.55;
      padding: 0;
      margin: 0;
      overflow-x: hidden;
    }

    /* Header - Non-sticky, scrolls away naturally */
    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
      color: white;
      padding: 24px 20px;
      box-shadow: var(--shadow-md);
      position: relative;
    }

    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-title-box h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .header-title-box p {
      font-size: 0.88rem;
      color: #cbd5e1;
      margin-top: 4px;
      line-height: 1.4;
    }

    .header-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
      align-items: center;
    }

    .nav-portal-btn {
      background: #ffffff;
      color: #1e3a8a;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 800;
      text-decoration: none;
      border: 1.5px solid #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .nav-portal-btn:hover {
      background: #f8fafc;
      color: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Container */
    .container {
      max-width: 1000px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* Filter & Progress Control Panel */
    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .category-select-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 260px;
    }

    .category-select-box label {
      font-size: 0.88rem;
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
    }

    .category-select {
      width: 100%;
      max-width: 440px;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      color: #1e293b;
      background: white;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .category-select:focus {
      border-color: var(--primary-light);
    }

    .progress-box {
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .score-highlight {
      color: #2563eb;
      font-size: 1.1rem;
    }

    /* Queue Status Info Bar */
    .queue-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: #1e40af;
      flex-wrap: wrap;
      gap: 8px;
    }

    .queue-status-text {
      font-weight: 600;
    }

    .btn-reset-queue {
      background: white;
      border: 1px solid #93c5fd;
      color: #1d4ed8;
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-reset-queue:hover {
      background: #dbeafe;
    }

    /* Question Cards List */
    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .question-card:hover {
      border-color: #cbd5e1;
    }

    .question-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .question-badge-num {
      background: #0f172a;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .question-info {
      flex: 1;
    }

    .meta-tags-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .page-tag {
      background: #e0f2fe;
      color: #0369a1;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #bae6fd;
    }

    .category-tag {
      background: #f1f5f9;
      color: #475569;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .question-stem {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.5;
    }

    /* Options Grid */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .option-btn {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      text-align: left;
      font-size: 0.92rem;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      user-select: none;
      line-height: 1.4;
    }

    .option-btn:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #94a3b8;
      transform: translateY(-1px);
    }

    .option-letter {
      width: 26px;
      height: 26px;
      border-radius: 4px;
      background: #e2e8f0;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* Option states */
    .option-btn.selected-correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
    }

    .option-btn.selected-correct .option-letter {
      background: var(--correct-border);
      color: white;
    }

    .option-btn.selected-wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text) !important;
    }

    .option-btn.selected-wrong .option-letter {
      background: var(--wrong-border);
      color: white;
    }

    .option-btn.reveal-correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      border-style: dashed !important;
      color: var(--correct-text) !important;
    }

    .option-btn.reveal-correct .option-letter {
      background: var(--correct-border);
      color: white;
    }

    .option-btn:disabled {
      cursor: default;
    }

    /* Detailed Explanation Box */
    .explanation-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      line-height: 1.55;
      display: none;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .explanation-box.correct {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-left: 4px solid #16a34a;
      color: #166534;
    }

    .explanation-box.wrong {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-left: 4px solid #dc2626;
      color: #991b1b;
    }

    .explanation-result-title {
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .explanation-detail {
      color: #334155;
      font-size: 0.88rem;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0,0,0,0.1);
    }

    .explanation-page-callout {
      margin-top: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      color: #0369a1;
      background: #e0f2fe;
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
    }

    /* Bottom Action Bar */
    .bottom-bar {
      margin-top: 32px;
      padding: 24px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .summary-stats {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
    }

    .btn-refresh {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 15px 32px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
      width: 100%;
      max-width: 460px;
    }

    .btn-refresh:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-refresh:active {
      transform: translateY(0);
    }

    footer {
      text-align: center;
      padding: 28px 16px 40px;
      color: #94a3b8;
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
      background: white;
      margin-top: 40px;
    }
  </style>
</head>

  <!-- Non-sticky Header -->
  <header>
    <div class="header-content">

        <h1>醫護支援人員護理技巧綜合溫習系統</h1>

  <div class="container">
    
    <!-- Control Panel -->
    <div class="control-panel">

        <div class="progress-box">

      </div>

      <!-- Queue Status Bar -->
      <div class="queue-status-bar">
        <span class="queue-status-text" id="queue-status-text">
          抽題機制：優先抽取未做過的新題（保證連續輪次不重複）

    </div>

    <!-- Questions Container -->
    <div class="questions-list" id="questions-container">

    <!-- Bottom Action Bar (Refresh button at bottom) -->

      <div class="summary-stats" id="bottom-summary-text">

      </div>
      <button class="btn-refresh" id="btn-refresh-quiz-bottom">
        換一批題目 / 重新生成 20 題 (再練習)
      </button>
    </div>

  </div>

  <footer>
    <p>醫護支援人員護理技巧 I 基礎證書綜合溫習系統 ｜ 講義出處頁碼精確對照 ｜ 專供學員溫習與考試練習使用</p>
  </footer>

    const fullQuestionsBank = [{"id": "q1", "category": "醫療體系與職責", "page": "講義筆記第 5 頁", "question": "根據講義介紹，香港共有多少間私營醫院？", "options": ["10 間", "12 間", "13 間", "15 間"], "answer": "13 間", "explanation": "講義第 5 頁明確列出：香港共有十三家私營醫院（包括嘉諾撒、播道、香港港安-司徒拔道、浸信會、養和、明德、寶血、仁安、聖保祿、聖德肋撒、香港港安-荃灣、港怡、香港中文大學醫院）。"}, {"id": "q2", "category": "醫療體系與職責", "page": "講義筆記第 10 頁", "question": "在醫管局《病人約章》中，以下哪一項屬於「病人的責任」而非病人的權利？", "options": ["詳細向醫護人員交代目前的健康狀況、過往病歷及過敏情況", "清楚知道病情、診斷結果和治療計劃及潛在風險", "接受或拒絕任何藥物、檢查或治療並知悉後果", "把個人病情資料及私隱獲得保密"], "answer": "詳細向醫護人員交代目前的健康狀況、過往病歷及過敏情況", "explanation": "講義第 10 頁《病人約章》第二部分（病人的責任）：詳細向醫護人員交代目前的健康狀況、過往病歷資料、過敏情況及其他有關詳情。其餘三項（知情權、選擇權、私隱權）均屬於第一部分「病人的權利」。"}, {"id": "q3", "category": "醫護人員名稱與英文縮寫", "page": "講義筆記第 17 頁", "question": "病房中統籌整個病房日常運作及護理管理的「病房經理」，其英文職稱縮寫是甚麼？", "options": ["D.O.M.", "W.M.", "N.O.", "A.P.N."], "answer": "W.M.", "explanation": "講義第 17 頁：病房經理英文為 Ward Manager，縮寫為 W.M.；D.O.M. 是部門運作經理 (Department Operations Manager)；N.O. 是護士長 (Nursing Officer)；A.P.N. 是資深護師 (Advanced Practice Nurse)。"}, {"id": "q4", "category": "醫護人員名稱與英文縮寫", "page": "講義筆記第 17 頁", "question": "醫管局架構中，「部門運作經理」的英文職稱縮寫是甚麼？", "options": ["D.O.M.", "C.C.E.", "H.C.E.", "GM(N)"], "answer": "D.O.M.", "explanation": "講義第 17 頁：部門運作經理為 Department Operations Manager (D.O.M.)；C.C.E. 為聯網總監 (Cluster Chief Executive)；H.C.E. 為醫院行政總監 (Hospital Chief Executive)；GM(N) 為護理總經理。"}, {"id": "q5", "category": "醫院部門英文縮寫", "page": "講義筆記第 15 頁", "question": "醫院內負責為各病房及手術室清洗、消毒及包裝重用無菌醫療物品的「中央消毒物品供應部」，其英文縮寫是甚麼？", "options": ["C.S.S.D.", "T.S.S.U.", "C.N.S.", "C.G.A.T."], "answer": "C.S.S.D.", "explanation": "講義第 15 頁：中央消毒物品供應部為 Central Sterile Supply Department (C.S.S.D.)；T.S.S.U. 為手術室消毒物品供應部；C.N.S. 為社康護理服務；C.G.A.T. 為社區老人評估小組。"}, {"id": "q6", "category": "病房常用英文術語", "page": "講義筆記第 18 頁", "question": "病房記錄病人每日飲水量、靜脈輸液量以及排尿量、引流量的表格稱為「進出量紀錄表」，其英文縮寫是甚麼？", "options": ["I&O Chart", "TPR Chart", "BP Chart", "MAR Chart"], "answer": "I&O Chart", "explanation": "講義第 18 頁：進出量紀錄表為 Intake & Output Chart (I&O Chart)。TPR Chart 為生命表徵紀錄表（體溫、脈搏、呼吸）；BP 為血壓。"}, {"id": "q7", "category": "病房常用英文術語", "page": "講義筆記第 18 頁", "question": "醫護支援人員協助長期臥床或行動不便病人從病床轉移至輪椅或輪床時，常使用的「病人過床板」英文是甚麼？", "options": ["Patslide", "Stretcher", "Commode chair", "Drip stand"], "answer": "Patslide", "explanation": "講義第 18 頁：病人過床板英文為 Patslide；Stretcher 為輪床；Commode chair 為大便車；Drip stand 為鹽水架。"}, {"id": "q8", "category": "病房常用英文術語", "page": "講義筆記第 18 - 19 頁", "question": "護士指示醫護支援人員「留取病人的痰涎樣本送檢」，在病房交更及醫囑中「痰」的英文術語是甚麼？", "options": ["Sputum", "Stool", "Urine", "Vomitus"], "answer": "Sputum", "explanation": "講義第 18 頁：痰為 Sputum；Stool 為大便；Urine 為小便；Vomitus 為嘔吐物。"}, {"id": "q9", "category": "人體結構與感覺", "page": "講義筆記第 27 頁", "question": "根據醫護專業知識與講義筆記，臨終病人在瀕死過程中，人體各種感覺器官中「最後消失的感覺」通常是哪一種？", "options": ["聽覺", "視覺", "味覺", "觸覺"], "answer": "聽覺", "explanation": "講義第 27 頁手寫重點明確標註：人之將死最後消失的感覺是「聽覺」。因此即使臨終病人處於昏迷或看似無反應狀態，醫護人員及家屬仍應在其身旁保持輕柔尊重的語調與之說話。"}, {"id": "q10", "category": "人體結構與感覺", "page": "講義筆記第 27 頁", "question": "關於人類舌頭味蕾對不同味道的敏感分佈，以下哪一項配對是正確的？", "options": ["舌尖：甜味 / 鹹味；舌根：苦味", "舌尖：苦味；舌根：甜味", "舌緣：苦味；舌尖：酸味", "舌根：酸味；舌緣：鹹味"], "answer": "舌尖：甜味 / 鹹味；舌根：苦味", "explanation": "講義第 27 頁：舌頭味蕾分佈為：舌尖對甜 (Sweet) 及鹹 (Salty) 最敏感；舌緣對酸 (Sour) 敏感；舌根對苦 (Bitter) 敏感。"}, {"id": "q11", "category": "人體結構與循環系統", "page": "講義筆記第 27 頁", "question": "人體心臟的左、右心房與心室之間設有「心瓣」，心瓣最主要的生理功能是甚麼？", "options": ["防止血液倒流", "過濾血液中的代謝廢物", "產生心跳電脈衝", "增加血液中的氧氣含量"], "answer": "防止血液倒流", "explanation": "講義第 27 頁：心臟主要分為左右心房和左右心室，上下心房和心室由心瓣相隔，心瓣的作用是「防止血液倒流」。"}, {"id": "q12", "category": "人體結構與神經系統", "page": "講義筆記第 26 頁", "question": "人體的周圍神經系統中，包含多少對腦神經以及多少對脊神經？", "options": ["12 對腦神經，31 對脊神經", "10 對腦神經，30 對脊神經", "12 對腦神經，12 對脊神經", "31 對腦神經，12 對脊神經"], "answer": "12 對腦神經，31 對脊神經", "explanation": "講義第 26 頁：周圍神經系統包括 12 對腦神經 (Cranial Nerves) 及 31 對脊神經 (Spinal Nerves)。"}, {"id": "q13", "category": "常見疾病與病理", "page": "講義筆記第 38 頁", "question": "根據世界衛生組織標準及講義說明，在安靜休息狀態下，成年人的「高血壓」臨床診斷標準是指血壓讀數持續等於或高於多少？", "options": ["收縮壓 ≥ 140 mmHg 或 舒張壓 ≥ 90 mmHg", "收縮壓 ≥ 130 mmHg 或 舒張壓 ≥ 85 mmHg", "收縮壓 ≥ 120 mmHg 或 舒張壓 ≥ 80 mmHg", "收縮壓 ≥ 160 mmHg 或 舒張壓 ≥ 100 mmHg"], "answer": "收縮壓 ≥ 140 mmHg 或 舒張壓 ≥ 90 mmHg", "explanation": "講義第 38 頁：理想成年人血壓應為收縮壓 < 120 mmHg 及舒張壓 < 80 mmHg；當持續達到或超過 140/90 mmHg 時，即被界定為高血壓。"}, {"id": "q14", "category": "常見疾病與病理", "page": "講義筆記第 40 頁", "question": "體重指標（BMI）是評估成年人體重狀況的常用工具，其計算公式是甚麼？", "options": ["體重 (公斤) ÷ [身高 (米) × 身高 (米)]", "身高 (米) ÷ [體重 (公斤) × 體重 (公斤)]", "體重 (磅) ÷ [身高 (厘米) × 身高 (厘米)]", "體重 (公斤) ÷ 身高 (厘米)"], "answer": "體重 (公斤) ÷ [身高 (米) × 身高 (米)]", "explanation": "講義第 40 頁：體重指標 BMI = 體重 (kg) / [身高 (m)]²。世界衛生組織亞洲成年人標準：18.5 - 22.9 為正常，23.0 - 24.9 為過重，≥ 25.0 為肥胖。"}, {"id": "q15", "category": "常見疾病與病理", "page": "講義筆記第 48 頁", "question": "急性中風是嚴重的神經科急症，公眾教育常用的辨識口訣是「談笑用兵」(FAST)，其中「笑」是指觀察病人甚麼徵狀？", "options": ["面部表情不對稱，口角歪斜", "說話言語不清，詞不達意", "雙手平舉時其中一側無力下垂", "神智清醒程度及反應能力"], "answer": "面部表情不對稱，口角歪斜", "explanation": "講義第 48 頁：「談笑用兵」中，「談」指言語表達是否清晰；「笑」指露出笑容時面部兩邊是否對稱、有否口角歪斜；「用」指手腳平舉是否無力下垂；「兵」指即刻致電 999 召喚救護車送院搶救。"}, {"id": "q16", "category": "常見疾病與病理", "page": "講義筆記第 56 頁", "question": "未受控制的糖尿病患者常出現典型的「三多一少」臨床徵狀，所謂的「三多一少」是指甚麼？", "options": ["多飲、多尿、多食、體重減少", "多睡、多汗、多食、排便減少", "多飲、多汗、多尿、食量減少", "多尿、多痛、多喘、活動減少"], "answer": "多飲、多尿、多食、體重減少", "explanation": "講義第 56 頁：糖尿病典型徵狀為「三多一少」：多飲（口渴多喝水）、多尿（尿量及頻率增加）、多食（易感到飢餓食量大）、體重減少（因葡萄糖無法被細胞利用而分解脂肪及蛋白質消耗）。"}, {"id": "q17", "category": "常見疾病與病理", "page": "講義筆記第 60 頁", "question": "肺結核（肺癆）病人服用抗結核藥物「利福平」(Rifampicin) 期間，常見一種良性副作用，醫護人員應預先向病人解釋以消除焦慮，該現象是甚麼？", "options": ["小便、淚水或汗液呈現橙紅色", "頭髮脫落及皮膚乾燥發癢", "大便呈現柏油般黑色", "牙齦持續腫脹出血"], "answer": "小便、淚水或汗液呈現橙紅色", "explanation": "講義第 60 頁手寫重點特別標註：肺結核藥物利福平會導致「尿液、汗水及分泌物變成橙紅色」，這是藥物代謝的正常現象，無須驚慌；另外需注意藥物可能損害肝臟功能，且肺結核患者須每日在胸肺科診所由醫護人員直接督導服藥 (DOTS)。"}, {"id": "q18", "category": "消毒劑與清潔", "page": "講義筆記第 91 頁", "question": "使用家用漂白水（次氯酸鈉）進行病房或環境消毒時，絕對不能與以下哪種清潔劑混和使用，以免化學反應釋放出致命的有毒氯氣？", "options": ["酸性清潔劑（如洗廁劑、潔廁得）", "清水", "中性洗潔精", "70% 消毒酒精"], "answer": "酸性清潔劑（如洗廁劑、潔廁得）", "explanation": "講義第 91 頁：使用漂白水時「切勿與其他酸性清潔劑（如潔廁劑）混和」，因為兩者混合會產生化學反應，釋放出對呼吸道及眼睛有強烈刺激及毒性的氯氣，極度危險。"}, {"id": "q19", "category": "消毒劑與清潔", "page": "講義筆記第 91 頁", "question": "在病房環境消毒中，若地面或物體表面受到病人的「血液、嘔吐物或分泌物」污染時，應使用甚麼濃度的稀釋家用漂白水抹拭消毒？", "options": ["1:49 稀釋家用漂白水 (約 1000 ppm 有效氯)", "1:99 稀釋家用漂白水 (約 500 ppm 有效氯)", "1:4 稀釋家用漂白水", "70% 外用消毒酒精"], "answer": "1:49 稀釋家用漂白水 (約 1000 ppm 有效氯)", "explanation": "講義第 91 頁及第 201 頁：一般日常環境清潔使用 1:99 稀釋漂白水；但當受到血液、體液或嘔吐物污染時，必須使用消毒效力較強的「1:49 稀釋家用漂白水」（將 1 份 5.25% 漂白水與 49 份水混和）抹淨消毒。"}, {"id": "q20", "category": "感染控制與醫療廢物", "page": "講義筆記第 134 - 135 頁", "question": "病房棄置注射針頭、刀片、碎安瓿等鋒利利器時，應放入第 1 組利器收集盒，當利器盒裝滿至多少時必須封口並妥善更換？", "options": ["裝滿至 70% 至 80% (約 3/4 滿) 即須封口", "裝滿至 100% 溢滿為止", "裝滿至 50% 半滿", "裝滿至 95%"], "answer": "裝滿至 70% 至 80% (約 3/4 滿) 即須封口", "explanation": "講義第 135 頁：利器盒屬於第 1 組醫療廢物容器，為保障醫護人員免受針刺意外傷害，容器裝滿至「70% - 80% (即約 3/4 滿)」時便必須封口，切勿過滿或強行擠壓利器。"}, {"id": "q21", "category": "感染控制與廢物分類", "page": "講義筆記第 136 頁", "question": "在病房污衣處理指引中，沾有大量傳染性血液、分泌物或烈性傳染病病人的床單被服，應該放入甚麼顏色的污衣袋內？", "options": ["紅色膠袋 / 水溶性防感染污衣袋", "白色帆布污衣袋", "黑色普通家居垃圾袋", "藍色透明膠袋"], "answer": "紅色膠袋 / 水溶性防感染污衣袋", "explanation": "講義第 136 頁：一般未受污染的常規污衣使用白色袋；沾有傳染性血液、體液或具感染風險的污染被服，必須放進「紅色膠袋」或直接放入「紅色水溶性膠袋」密封，以便洗衣房進行高溫高壓或化學消毒。"}, {"id": "q22", "category": "生命表徵測量", "page": "講義筆記第 164 頁", "question": "在不同測度體溫的途徑中，正常健康成人的「口探」(Oral Temperature) 正常體溫範圍通常是多少？", "options": ["36.5°C - 37.5°C", "35.0°C - 36.0°C", "37.5°C - 38.5°C", "36.0°C - 36.5°C"], "answer": "36.5°C - 37.5°C", "explanation": "講義第 164 頁：不同途徑之正常體溫範圍：口探 (Oral) 及耳探 (Tympanic) 正常為 36.5°C - 37.5°C；腋探 (Axillary) 正常為 36.0°C - 37.0°C；肛探 (Rectal) 正常為 37.0°C - 38.0°C（最接近體內核心溫度）。"}, {"id": "q23", "category": "生命表徵測量", "page": "講義筆記第 164 頁", "question": "若病人剛進食過熱湯、冷飲或吸煙，為確保測量準確，護理人員應在相隔多久之後才可替病人進行口探？", "options": ["15 至 30 分鐘", "1 至 2 分鐘", "5 分鐘", "60 分鐘"], "answer": "15 至 30 分鐘", "explanation": "講義第 164 頁口探注意事項：若病人剛進食、飲用冷熱飲品、吸煙或嚼口香糖，口腔溫度會受外在溫度暫時影響，必須等候 15 至 30 分鐘後方可進行口探測量。"}, {"id": "q24", "category": "生命表徵測量", "page": "講義筆記第 169 頁", "question": "為神智清醒的成年病人進行常規生命表徵檢查時，最常用的末梢動脈「量度脈搏位置」是哪一條動脈？", "options": ["橈動脈 (Radial Artery)", "頸動脈 (Carotid Artery)", "股動脈 (Femoral Artery)", "足背動脈 (Dorsalis Pedis Artery)"], "answer": "橈動脈 (Radial Artery)", "explanation": "講義第 89 頁：手腕拇指側的「橈動脈」(Radial Artery) 是日常最常用及最方便的量度脈搏位置；頸動脈則主要用於心跳驟停或急救心肺復甦時快速評估血液循環。"}, {"id": "q25", "category": "生命表徵測量", "page": "講義筆記第 170 頁", "question": "若替病人量度脈搏時發現脈搏跳動不規則（心律不齊），護理人員應該如何正確計算心率？", "options": ["必須數足完整的一分鐘 (60 秒)", "數 15 秒然後乘以 4", "數 30 秒然後乘以 2", "數 10 秒然後乘以 6"], "answer": "必須數足完整的一分鐘 (60 秒)", "explanation": "講義第 170 頁：正常規律脈搏可數 30 秒乘 2；但如果發現病人脈搏不規則、過快或過慢（心律不齊），必須「數足完整的一分鐘 (60 秒)」，並即時通知當值護士評估。"}, {"id": "q26", "category": "生命表徵測量", "page": "講義筆記第 171 頁", "question": "護理人員在觀察並計算病人的「呼吸率」時，以下哪一種技巧是最正確且符合專業常規的？", "options": ["量完脈搏後手指不離開病人手腕，假裝繼續計脈搏以暗中觀察呼吸起伏", "預先明確大聲告知病人：「我現在要幫你數呼吸，請放鬆深呼吸」", "將手掌直接用力按壓在病人胸膛上感受起伏", "只觀察病人鼻孔是否有呼氣氣流"], "answer": "量完脈搏後手指不離開病人手腕，假裝繼續計脈搏以暗中觀察呼吸起伏", "explanation": "講義第 171 頁：呼吸是可以受大腦意識主觀控制的。如果預先告知病人要量呼吸，病人往往會不自覺地刻意改變呼吸深淺或節奏。因此正確做法是量完脈搏後手指不移開，假裝繼續量脈搏，暗中計算胸腹起伏次數。正常成人安靜呼吸率為每分鐘 12 - 20 次。"}, {"id": "q27", "category": "生命表徵測量", "page": "講義筆記第 166 頁", "question": "使用血壓計替病人測量血壓時，以下哪一項操作注意事項是正確的？", "options": ["測量前讓病人安靜休息 5 - 10 分鐘，手臂高度應與心臟處於同一水平", "可以在病人做過動靜脈造瘻手術 (AV Fistula) 的洗腎手臂上量血壓", "血壓袖帶 (Cuff) 綁得越鬆越準確", "若測量結果不確定，應立即在同一手臂連續重複充氣加壓 3 次"], "answer": "測量前讓病人安靜休息 5 - 10 分鐘，手臂高度應與心臟處於同一水平", "explanation": "講義第 166 頁：量血壓前病人應靜坐休息 5-10 分鐘，手臂與心臟齊平。嚴禁在患肢、乳癌淋巴切除側或已建立洗腎瘻管 (AV Fistula) 的手臂上量血壓；如需重複測量，應間隔 2-3 分鐘讓血管充分充盈復原。"}, {"id": "q28", "category": "檢查準備與檢驗", "page": "講義筆記第 180 頁", "question": "病人排期接受「盆腔及膀胱超聲波檢查」(USG Pelvis/Bladder) 前，醫護人員應指導病人進行甚麼準備？", "options": ["檢查前約 1 小時飲用多杯清水並暫時忍尿，使膀胱脹滿以利顯影", "檢查前必須嚴格禁食禁水 12 小時", "檢查前服用強力瀉藥排清大便", "檢查前靜脈注射大量造影劑"], "answer": "檢查前約 1 小時飲用多杯清水並暫時忍尿，使膀胱脹滿以利顯影", "explanation": "講義第 180 頁：膀胱超聲波檢查前約 1 小時應「飲多杯水令膀胱脹滿」，因為充滿尿液的膀胱能作為超聲波良好的透聲窗，令膀胱及後方盆腔器官影像更加清晰。"}, {"id": "q29", "category": "檢查準備與檢驗", "page": "講義筆記第 193 頁", "question": "使用尿糖及尿酮試紙為病人檢驗尿液時，以下哪一項程序操作是正確的？", "options": ["從試紙瓶取出試紙後必須立刻封蓋，防止試紙受潮變質", "為節省資源，可將試紙縱向剪開一半分開兩次使用", "將試紙浸泡在尿液中至少 5 分鐘後才拿出來", "不用理會瓶上的計時標準，隨時對照顏色即可"], "answer": "從試紙瓶取出試紙後必須立刻封蓋，防止試紙受潮變質", "explanation": "講義第 193 頁：驗尿程序要點：1. 取出試紙後「立刻封蓋」，因試紙上的化學試劑極易受空氣濕度影響失效；2. 試紙放入尿液後應「立刻取出」並抖去多餘尿液；3. 嚴格按瓶上指定時間（如 30 秒、60 秒）對照色條；4. 絕對不可任意剪裁試紙。"}, {"id": "q30", "category": "臨終心理反應", "page": "講義筆記第 196 頁", "question": "根據庫伯勒-羅斯 (Dr. Elisabeth Kübler-Ross) 的臨終心理學說，當瀕死病人不斷埋怨「為甚麼是我？為甚麼會發生在我身上？」，甚至將不滿情緒轉移投射至家人、醫生及護士身上時，病人正處於哪一個心理反應階段？", "options": ["憤怒期 (Anger)", "震驚及否認期 (Shock and Denial)", "討價還價期 (Bargaining)", "憂鬱期 (Depression)"], "answer": "憤怒期 (Anger)", "explanation": "講義第 196 頁：憤怒期 (Anger) 的病人會因無法接受命運而問「為什麼是我？」，負面情緒會轉移至身邊的家人、醫生和護士，並對病房飲食或服務百般投訴。"}, {"id": "q31", "category": "臨終心理反應", "page": "講義筆記第 196 頁", "question": "臨終病人知道「否認」及「憤怒」無法改變事實後，轉而向自己所信仰的神明祈求，發誓「如果能讓我多活一年，我一定改過自新重新做人」，這屬於心理反應的哪一階段？", "options": ["討價還價期 (Bargaining)", "否認期 (Denial)", "憂鬱期 (Depression)", "接受期 (Acceptance)"], "answer": "討價還價期 (Bargaining)", "explanation": "講義第 196 頁：討價還價期 (Bargaining) 的特點是病人希望延長生命，常向所信之神許下誓言（如行善、改變惡習、奉獻），試圖換取更多存活時間。"}, {"id": "q32", "category": "臨終心理反應", "page": "講義筆記第 196 頁", "question": "當臨終病人面對日益衰竭的軀體，深知死亡無可避免，表現出極度悲傷、暗自飲泣、胃口大減且不願與人交談，此時期屬於心理學中的哪一階段？護理人員應特別提高警惕慎防甚麼意外？", "options": ["憂鬱期 (Depression)；應提高警惕慎防病人自我傷害或自殺", "憤怒期 (Anger)；應慎防病人攻擊醫護人員", "接受期 (Acceptance)；應慎防病人拒絕飲食", "否認期 (Denial)；應慎防病人擅自離院"], "answer": "憂鬱期 (Depression)；應提高警惕慎防病人自我傷害或自殺", "explanation": "講義第 196 頁：憂鬱期 (Depression) 的病人放棄乞求，感到極度沮喪悲傷、體重下降，嚴重抑鬱者在此時期「有選擇自殺或自我傷害的風險」，醫護人員需加強監護及情緒支援。"}, {"id": "q33", "category": "臨終病人心理照顧", "page": "講義筆記第 197 頁", "question": "在為臨終病人提供心理與情感溝通護理時，以下哪一種溝通態度是「絕對不可採取」的？", "options": ["使用不切實際的假言安慰（例如：騙病人「你很快就會好起來出院回家」）", "言詞誠懇有禮，表現真誠關懷與諒解", "留心傾聽病人的訴說，提供情緒支援", "適度運用身體語言，如輕握病人的手或輕拍肩膊"], "answer": "使用不切實際的假言安慰（例如：騙病人「你很快就會好起來出院回家」）", "explanation": "講義第 197 頁特別強調：溝通時「切忌假言安慰」（False Reassurance）。虛假的承諾會破壞病人對醫護的信任，令病人無法在剩餘時間內好好交代後事及達成心願。"}, {"id": "q34", "category": "屍體處理三大類別", "page": "講義筆記第 199 頁", "question": "根據香港衛生署及醫管局指引，第 1 類屍體在屍體標籤及處理上應使用甚麼顏色的標籤識別？", "options": ["藍色標籤", "黃色標籤", "紅色標籤", "黑色標籤"], "answer": "藍色標籤", "explanation": "講義第 199 頁：第 1 類屍體以「藍色標籤」識別，適用於所有未感染特定危險傳染病的一般死者，採取標準預防措施，不需要裝入屍袋。"}, {"id": "q35", "category": "屍體處理三大類別", "page": "講義筆記第 199 頁", "question": "以下哪一種傳染病在病人離世後，其屍體屬於「第 2 類（黃色標籤）」傳染預防處理類別？", "options": ["嚴重急性呼吸系統綜合症 (SARS / 沙士)", "炭疽病 (Anthrax)", "鼠疫 (Plague)", "狂犬病 (Rabies)"], "answer": "嚴重急性呼吸系統綜合症 (SARS / 沙士)", "explanation": "講義第 199 頁：第 2 類（黃色標籤）包括：愛滋病 (HIV)、丙型肝炎、未剖驗克雅二氏症(瘋牛症)、嚴重急性呼吸系統綜合症 (SARS)、禽流感、中東呼吸綜合症 (MERS)、COVID-19；炭疽、鼠疫、狂犬病及病毒性出血熱則屬於第 3 類（紅色標籤）。"}, {"id": "q36", "category": "屍體處理三大類別", "page": "講義筆記第 199 頁", "question": "對於感染「炭疽病」、「鼠疫」或「狂犬病」離世的死者，其屍體處理屬於哪一類別？對應甚麼顏色的屍體標籤？", "options": ["第 3 類；紅色標籤", "第 2 類；黃色標籤", "第 1 類；藍色標籤", "第 4 類；黑色標籤"], "answer": "第 3 類；紅色標籤", "explanation": "講義第 199 頁：第 3 類以「紅色標籤」識別，對象包括炭疽病、鼠疫、狂犬病、病毒性出血熱（如埃博拉）以及已剖驗之克雅二氏症等高度致命傳染病。"}, {"id": "q37", "category": "屍體處理三大類別", "page": "講義筆記第 201 - 202 頁", "question": "處理「第 2 類（黃色標籤）」的屍體時，以下哪一項遺體處理常規是「絕對不可進行」的？", "options": ["不可對屍體進行化學防腐處理 (Embalming)", "不可讓家屬瞻仰遺容", "不可在殯儀館內為屍體進行化妝", "不可將遺體放入火化爐火葬"], "answer": "不可對屍體進行化學防腐處理 (Embalming)", "explanation": "講義第 201 頁及第 202 頁：第 2 類屍體可瞻仰遺容、可裝身及化妝，但「不可進行防腐處理」(No Embalming)，以防防腐針刺及排液過程污染環境；並且建議火葬。"}, {"id": "q38", "category": "屍體處理三大類別", "page": "講義筆記第 202 頁", "question": "對於「第 3 類（紅色標籤）」的高度傳染性屍體，在殯儀及善後處置上有極嚴格的法定規定，以下哪一項敘述是完全正確的？", "options": ["屍體入袋後不可拉開拉鍊，不可進行化妝、不可防腐，亦不可讓家屬瞻仰遺容", "家屬可以在不接觸遺體的情況下拉開屍袋拉鍊近距離瞻仰遺容", "殯儀館化妝師可以穿全套防護服為其穿壽衣及化妝", "只要家屬簽署免責同意書即可安排土葬及防腐"], "answer": "屍體入袋後不可拉開拉鍊，不可進行化妝、不可防腐，亦不可讓家屬瞻仰遺容", "explanation": "講義第 202 頁：第 3 類（紅色標籤）傳染風險極高，必須嚴格遵守：1. 不可從膠袋取出屍體；2. 不可拉開拉鍊；3. 不可化妝裝身；4. 不可防腐處理；5. 不可讓家屬瞻仰遺容；必須盡量直接密封火葬。"}, {"id": "q39", "category": "屍體處理三大類別", "page": "講義筆記第 201 頁", "question": "裝載第 2 類及第 3 類傳染病死者的特製屍袋，根據指引其結實厚度規格至少不得少於多少？", "options": ["150 微米 (μm)", "50 微米 (μm)", "100 微米 (μm)", "300 微米 (μm)"], "answer": "150 微米 (μm)", "explanation": "講義第 201 頁 C(ii) 項：第 2 及第 3 類屍體應放在一個結實而「厚度不少於 150 微米」的屍體膠袋內，拉鍊封密或以膠紙網帶紮緊，切勿使用扣針。"}, {"id": "q40", "category": "屍體護理程序", "page": "講義筆記第 199 - 201 頁", "question": "在病房確認病人死亡並準備進行遺體料理前，護理人員首要必須嚴格執行的核對程序是甚麼？", "options": ["核對屍籤上的資料與死者手鈪上的資料是否完全一致", "立即將死者衣物全部丟棄到黑色垃圾袋", "先將屍袋拉鍊完全封閉並貼膠紙", "替死者拔除所有體內引流管但無須通知醫生"], "answer": "核對屍籤上的資料與死者手鈪上的資料是否完全一致", "explanation": "講義第 201 頁 viii 項：料理屍體及入屍袋前後，必須嚴格「核對屍籤（載有死者姓名、身份證號碼、年齡等）與死者手鈪上的資料」，確保身份核實無誤，防止錯認遺體。"}, {"id": "q41", "category": "常見疾病與病理", "page": "講義筆記第 62 頁", "question": "在香港，初生嬰兒及小學生廣泛接種的「卡介苗」(BCG) 是用作預防哪一種傳染病的防疫注射？", "options": ["結核病 (肺癆)", "乙型肝炎", "麻疹", "白喉及破傷風"], "answer": "結核病 (肺癆)", "explanation": "講義第 62 頁：預防結核病的防疫注射為「卡介苗」(BCG Vaccine)，初生嬰兒及經結核菌素試驗呈陰性之小學生均會接受注射。"}, {"id": "q42", "category": "病人護理技巧", "page": "講義筆記第 167 頁", "question": "替病房住院病人定期量度體重時，為取得具可比性及準確的數值，以下哪一項是正確的常規做法？", "options": ["盡量在每日同一時間（如清晨排尿後及進食早餐前）量度，並先將磅秤歸零", "病人必須穿厚外套及皮鞋站在秤面上", "在病人剛吃飽大餐喝大量湯水後立即量度", "由病人自己估計體重直接記錄在圖表上"], "answer": "盡量在每日同一時間（如清晨排尿後及進食早餐前）量度，並先將磅秤歸零", "explanation": "講義第 167 頁：量度體重技巧：1. 磅秤需先歸零；2. 脫下外套及鞋子；3. 盡量固定在每日同一時間（如早上排便排尿後、未進食前）量度，以減少飲食排泄帶來的體重波動。"}, {"id": "q43", "category": "醫護人員名稱與英文縮寫", "page": "講義筆記第 17 頁", "question": "公立醫院中統管全院護理架構及護理專業發展的最高負責人「護理總經理」，其英文職稱縮寫是甚麼？", "options": ["GM(N)", "GM(AS)", "GM(F)", "C.G.M.N."], "answer": "GM(N)", "explanation": "講義第 17 頁：護理總經理為 General Manager (Nursing)，縮寫為 GM(N)；GM(AS) 為行政總經理；GM(F) 為財務總經理；CGMN 為聯網護理總經理。"}, {"id": "q44", "category": "醫院部門英文縮寫", "page": "講義筆記第 15 頁", "question": "專門為出院病人或行動不便之慢性病長者提供上門居家護理的「社康護理服務」，其英文縮寫是甚麼？", "options": ["C.N.S.", "C.G.A.T.", "O.P.D.", "I.C.T."], "answer": "C.N.S.", "explanation": "講義第 15 頁：社康護理服務英文為 Community Nursing Service，縮寫為 C.N.S.；C.G.A.T. 為社區老人評估小組；O.P.D. 為門診部；I.C.T. 為醫院感染控制部。"}, {"id": "q45", "category": "病人護理技巧", "page": "講義筆記第 164 頁", "question": "對於神智不清、神經抽搐、患有呼吸困難只能張口呼吸或 6 歲以下的幼童，以下哪種體溫量度途徑屬於「禁忌」？", "options": ["口探", "耳探", "腋探", "額探"], "answer": "口探", "explanation": "講義第 164 頁：口探禁忌對象包括：神智不清、昏迷、抽搐、呼吸困難（不能閉口）、嬰幼兒、剛接受口腔或鼻部手術者，因病人可能不慎咬斷水銀體溫計或無法正確含緊體溫計造成危險及誤差。"}, {"id": "q46", "category": "消毒劑與清潔", "page": "講義筆記第 88 頁", "question": "在醫療護理程序中，用於病人注射前皮膚消毒或醫護人員手部消毒的「醫用酒精」，最有效且最常用的殺菌濃度是多少？", "options": ["70% 至 75%", "99% 純酒精", "30% 至 40%", "10% 至 20%"], "answer": "70% 至 75%", "explanation": "講義第 88 頁：酒精濃度以 70% 至 75% 最具殺菌效果，因為該濃度的酒精能有效穿透細菌細胞壁並使蛋白質變性凝固；過高濃度（如 99%）會使細菌表面蛋白過快脫水凝固形成保護層，反而無法殺死內部細菌。"}, {"id": "q47", "category": "屍體處理三大類別", "page": "講義筆記第 199 頁", "question": "患有「克雅二氏症」（Creutzfeldt-Jakob Disease, CJD，俗稱瘋牛症人類型）的病人在醫院離世，若其遺體「已經進行過剖驗」，應歸入哪一類屍體處理？", "options": ["第 3 類 (紅色標籤)", "第 2 類 (黃色標籤)", "第 1 類 (藍色標籤)", "第 4 類 (綠色標籤)"], "answer": "第 3 類 (紅色標籤)", "explanation": "講義第 199 頁特別考點：克雅二氏症如果「未經剖驗」，歸入第 2 類（黃色標籤）；但如果「已經剖驗」，腦組織及腦脊髓液等高傳染性普里昂蛋白 (Prion) 暴露，危險性大增，必須提升為「第 3 類（紅色標籤）」嚴格處理！"}, {"id": "q48", "category": "舒緩治療簡介", "page": "講義筆記第 196 頁", "question": "舒緩治療（善終服務 / Palliative Care）的宗旨是為末期病者及其家屬提供整體性照顧，以下哪一項「不符合」舒緩治療的基本信念？", "options": ["使用一切人工科技刻意延長病人的痛苦瀕死過程", "接納死亡是人生的自然過程", "尊重生命，不故意延長或縮短病人的生命", "重視病人的生命質素，盡力緩解身心疼痛"], "answer": "使用一切人工科技刻意延長病人的痛苦瀕死過程", "explanation": "講義第 196 頁舒緩治療信念：1. 接納死亡是人生自然過程；2. 尊重生命；3. 「不故意延長亦不縮短病人生命」；4. 重視生命質素與尊嚴。刻意使用無效儀器延長痛苦並非舒緩治療之宗旨。"}, {"id": "q49", "category": "常見疾病與病理", "page": "講義筆記第 41 頁", "question": "高血壓通常被稱為「隱形殺手」，因為很多患者早期全無不適，但當血壓過高時，病人最常見的自覺徵狀包括甚麼？", "options": ["頭痛、頭暈、後頸部緊繃及視力模糊", "持續高燒及全身關節腫痛", "排尿疼痛及尿液帶血", "大便次數增加及肚瀉"], "answer": "頭痛、頭暈、後頸部緊繃及視力模糊", "explanation": "講義第 41 頁：高血壓常見徵狀包括頭痛（尤其後腦勺晨起頭痛）、頭暈、疲倦、視力模糊、心悸等，但亦有大量患者毫無徵狀，因此需定期測量血壓。"}, {"id": "q50", "category": "醫療廢物處理", "page": "講義筆記第 134 頁", "question": "病房產生的各類垃圾中，以下哪一項「不屬於」法定醫療廢物，應丟棄在黑色普通家居垃圾袋中？", "options": ["病人吃剩的飯盒、水果皮及未受污染的包裝紙", "沾有病人血液的紗布和棉花球", "用過的即棄注射針筒及針咀", "病人的嘔吐物及引流袋內含之體液"], "answer": "病人吃剩的飯盒、水果皮及未受污染的包裝紙", "explanation": "講義第 134 頁：未受病人血液、體液或傳染性分泌物污染的日常生活垃圾（如飯盒、果皮、清潔紙巾、包裝盒），屬於一般生活垃圾，使用「黑色垃圾袋」收集；沾血敷料、針咀及病理廢物方屬醫療廢物。"}, {"id": "q51", "category": "醫療團隊與專職醫療", "page": "講義筆記第 32 頁", "question": "在公立醫院專職醫療團隊中，專門協助中風或骨折病人進行日常生活技能訓練（如自行進食、穿衣、如廁）及家居環境改裝評估的專業人員是甚麼？", "options": ["職業治療師 (Occupational Therapist)", "物理治療師 (Physiotherapist)", "言語治療師 (Speech Therapist)", "足病診療師 (Podiatrist)"], "answer": "職業治療師 (Occupational Therapist)", "explanation": "講義第 32 頁：專職醫療部門分工：職業治療 (Occupational Therapy) 著重於日常自理功能訓練、認知及手部精細動作與家居評估；物理治療 (Physiotherapy) 著重於關節活動、肌肉力量及步態行走訓練；言語治療 (Speech Therapy) 處理吞嚥及言語障礙。"}, {"id": "q52", "category": "醫療團隊與專職醫療", "page": "講義筆記第 32 頁", "question": "病房病人進食時經常出現嚴重嗆咳、吞嚥困難，護士通常會安排哪一個專職醫療部門進行吞嚥能力評估及制定稠度糊餐指引？", "options": ["言語治療部 (Speech Therapy)", "物理治療部 (Physiotherapy)", "營養部 (Dietetics)", "義肢矯形部 (Prosthetics & Orthotics)"], "answer": "言語治療部 (Speech Therapy)", "explanation": "講義第 32 頁：言語治療師主要職責包括評估及治療病人的溝通障礙以及吞嚥障礙 (Dysphagia)，指導合適的食物形態（如碎餐、糊餐）及凝固粉 (Thickener) 調配比例。"}, {"id": "q53", "category": "病房常用英文術語", "page": "講義筆記第 18 頁", "question": "為病人進行心臟電生理活動檢測的「心電圖」，其英文簡稱縮寫是甚麼？", "options": ["E.C.G.", "E.E.G.", "E.M.G.", "E.N.T."], "answer": "E.C.G.", "explanation": "講義第 18 頁：心電圖英文全稱為 Electrocardiogram，縮寫為 E.C.G.（或 EKG）。E.N.T. 是耳鼻喉科 (Ear, Nose, Throat)。"}, {"id": "q54", "category": "病房常用英文術語", "page": "講義筆記第 18 頁", "question": "醫護人員工作時穿戴的外科口罩、手套、保護衣、護目鏡及面罩等統稱為「個人防護裝備」，其英文縮寫是甚麼？", "options": ["P.P.E.", "C.S.S.D.", "P.C.A.", "P.O.C."], "answer": "P.P.E.", "explanation": "講義第 18 頁：個人防護裝備英文為 Personal Protective Equipment，縮寫為 P.P.E.。"}, {"id": "q55", "category": "人體系統與功能", "page": "講義筆記第 26 頁", "question": "健康成年人的膀胱生理容量約為多少毫升？當尿液累積至多少毫升時，大腦會開始產生正常尿意？", "options": ["最大容量約 500 毫升；約累積 250 - 300 毫升時產生尿意", "最大容量約 100 毫升；約累積 50 毫升時產生尿意", "最大容量約 1500 毫升；約累積 1000 毫升時產生尿意", "最大容量約 200 毫升；約累積 100 毫升時產生尿意"], "answer": "最大容量約 500 毫升；約累積 250 - 300 毫升時產生尿意", "explanation": "講義第 26 頁筆記手寫重點標註：正常膀胱最大容量約 500 ml，當儲尿約 250 至 300 ml 時，神經感受器受到擴張刺激，向中樞神經傳遞信號而引起尿意。"}, {"id": "q56", "category": "人體系統與功能", "page": "講義筆記第 26 頁", "question": "人體的自主神經系統 (Autonomic Nervous System) 由哪兩個相互拮抗的系統組成，共同維持人體器官平衡？", "options": ["交感神經系統 與 副交感神經系統", "大腦系統 與 小腦系統", "腦神經系統 與 脊神經系統", "隨意神經系統 與 不隨意神經系統"], "answer": "交感神經系統 與 副交感神經系統", "explanation": "講義第 26 頁：自主神經系統分為：1. 交感神經系統 (Sympathetic，應付緊急緊張、心跳加快、血壓上升)；2. 副交感神經系統 (Parasympathetic，放鬆休養、促進腸胃消化、心跳減緩)。"}, {"id": "q57", "category": "環境衛生與感染控制", "page": "講義筆記第 82 頁", "question": "病房中供病人飲用的熱水瓶及室溫開水壺，根據病房衛生安全常規，應相隔多久清洗及更換一次？", "options": ["早晚兩次更換與清洗", "每星期更換一次", "只要水未喝完就無須更換", "每兩日更換一次"], "answer": "早晚兩次更換與清洗", "explanation": "講義第 82 頁 10 項：病房沸水及室溫開水壺，應「早晚兩次更換」，確保病人飲用水衛生新鮮，防止細菌孳生及灰塵污染。"}, {"id": "q58", "category": "職業安全健康", "page": "講義筆記第 149 頁", "question": "醫護支援人員搬運重物或協助病人扶抱轉移時，為避免腰背拉傷，以下哪一項提舉動作原則是正確的？", "options": ["保持背部平直，屈膝下蹲，利用腿部力量升起，並讓重物貼近身體", "雙腿伸直，彎腰向前俯身用力將重物猛然提起", "提舉重物時，身體應大幅度左右扭轉腰部以借力", "單手用力提起所有重物，另一隻手插袋"], "answer": "保持背部平直，屈膝下蹲，利用腿部力量升起，並讓重物貼近身體", "explanation": "講義第 149 頁職安健搬運原則：1. 保持腰背挺直；2. 屈膝下蹲，運用全身最大最有力的下肢及臀部肌肉發力；3. 重物要盡量貼近身體重心；4. 轉向時移動雙腳，嚴禁扭轉腰部。"}, {"id": "q59", "category": "生命表徵測量", "page": "講義筆記第 166 頁", "question": "測量血壓時，若選擇的血壓袖帶 (Blood Pressure Cuff) 太窄或太寬，對測量結果會有甚麼影響？", "options": ["袖帶太窄會導致讀數偏高；袖帶太寬會導致讀數偏低", "袖帶太窄會導致讀數偏低；袖帶太寬會導致讀數偏高", "袖帶寬窄對血壓讀數完全沒有任何影響", "袖帶太窄會導致血壓計漏氣無法充氣"], "answer": "袖帶太窄會導致讀數偏高；袖帶太寬會導致讀數偏低", "explanation": "講義第 166 頁：標準血壓袖帶氣囊寬度應覆蓋上臂圓周約 40%。若袖帶過窄，需要額外充更高氣壓才能壓扁動脈，測得血壓值會「偏高」(Falsely High)；若袖帶過寬，分散壓力，測得數值會「偏低」(Falsely Low)。"}, {"id": "q60", "category": "檢查準備與檢驗", "page": "講義筆記第 180 頁", "question": "接受正電子電腦掃描 (PET-CT) 檢查前，病人必須嚴格遵守以下哪一項飲食準備？", "options": ["檢查前禁食至少 4 至 6 小時，絕對不可飲用糖水或含糖飲料（可飲少量清水）", "檢查前 2 小時飲用大量葡萄糖水以補充足夠體力", "檢查前必須進食高糖高熱量餐以顯影癌細胞", "檢查前只可飲用濃茶或中藥湯水"], "answer": "檢查前禁食至少 4 至 6 小時，絕對不可飲用糖水或含糖飲料（可飲少量清水）", "explanation": "講義第 180 頁：PET-CT 正電子掃描使用的放射性示蹤劑是葡萄糖類似物 (FDG)。若檢查前進食含糖食物或飲料，體內高血糖會競爭性抑制示蹤劑吸收，嚴重影響顯影效果。因此檢查前 4-6 小時必須禁食，不可飲用糖水或中藥，只可飲用小量清水。"}, {"id": "q61", "category": "舒緩治療簡介", "page": "講義筆記第 196 頁", "question": "在臨終舒緩治療中，倡導為病人及其家屬提供「四全照顧」，所謂「四全」包括以下哪四個層面？", "options": ["全人、全家、全程、全隊", "全體、全心、全力、全民", "全院、全科、全日、全時", "全包、全免、全面、全職"], "answer": "全人、全家、全程、全隊", "explanation": "講義第 196 頁：舒緩治療目標倡導「四全照顧」：1. 全人（身心靈全面照顧）；2. 全家（照顧病人同時關顧家屬心理需要）；3. 全程（從確診末期、臨終到家屬哀傷期全程陪伴）；4. 全隊（醫生、護士、社工、物理治療師、臨床心理學家、院牧及義工結合的跨專業團隊）。"}, {"id": "q62", "category": "屍體處理三大類別", "page": "講義筆記第 199 頁", "question": "對於「第 1 類（藍色標籤）」的死者遺體，在殯儀善後處置方面，以下哪一項敘述是符合指引的？", "options": ["不需要裝入特製屍袋，殯儀館內可以化妝裝身、可防腐、可瞻仰遺容，可土葬或火葬", "必須使用 150 微米屍袋密封且不可拉開拉鍊", "絕對不可進行瞻仰遺容，必須在 24 小時內火化", "家屬必須穿著全套重度防護服才可領取遺體"], "answer": "不需要裝入特製屍袋，殯儀館內可以化妝裝身、可防腐、可瞻仰遺容，可土葬或火葬", "explanation": "講義第 199 頁：第 1 類（藍色標籤）為常規屍體，感染風險低，採取標準預防措施即可。屍體不需入屍袋，允許化妝、穿衣裝身、進行防腐處理、瞻仰遺容，並且可自由選擇土葬或火葬。"}, {"id": "q63", "category": "屍體處理三大類別", "page": "講義筆記第 199 - 201 頁", "question": "以下哪一種傳染病在死者遺體分類中，與炭疽、狂犬病同屬於最高防護級別的「第 3 類（紅色標籤）」？", "options": ["病毒性出血熱 (如伊波拉病毒、登革出血熱等)", "乙型肝炎", "季節性流感", "水痘"], "answer": "病毒性出血熱 (如伊波拉病毒、登革出血熱等)", "explanation": "講義第 199 頁：第 3 類（紅色標籤）包括炭疽病、鼠疫、狂犬病、病毒性出血熱 (Viral Haemorrhagic Fevers，如埃博拉 Ebola、馬爾堡 Marburg 等) 以及已剖驗之克雅二氏症。傳染性及致命性極高。"}, {"id": "q64", "category": "屍體處理程序", "page": "講義筆記第 201 頁", "question": "在病房進行移屍至殮房的過程中，為減少對病房其他病人及探訪者的騷擾與心理不安，護理人員應採取甚麼措施？", "options": ["在移屍必經之路及床位四周圍上屏風", "大聲呼喊通知所有人迴避", "將遺體停放在病房走廊等待一小時", "由病人自行陪同移送"], "answer": "在移屍必經之路及床位四周圍上屏風", "explanation": "講義第 199 頁及第 201 頁 xi 項：病人離世及移屍時，應「用屏風遮掩，在移屍時之必經之路圍上屏風」，以尊重逝者尊嚴，並減低對病房其他體弱病人及家屬的心理影響。"}, {"id": "q65", "category": "病人護理技巧", "page": "講義筆記第 162 - 164 頁", "question": "人體四大「生命表徵」(Vital Signs, TPR & BP) 包括哪四項生理指標？", "options": ["體溫 (T)、脈搏 (P)、呼吸 (R)、血壓 (BP)", "體重、身高、血糖、血脂", "年齡、性別、心率、視力", "出入量、排尿量、食量、睡眠時間"], "answer": "體溫 (T)、脈搏 (P)、呼吸 (R)、血壓 (BP)", "explanation": "講義第 162 頁：四大生命表徵 (Vital Signs) 簡寫為 TPR & BP，即體溫 (Temperature)、脈搏 (Pulse)、呼吸率 (Respiratory Rate) 和血壓 (Blood Pressure)，是評估人體生命基本機能最直接客觀的指標。"}, {"id": "q66", "category": "人體系統與循環功能", "page": "講義筆記第 27 頁", "question": "人體血液循環系統中，以下關於「肺動脈」與「肺靜脈」內流動血液性質的敘述，哪一項是完全正確的？", "options": ["肺動脈流的是缺氧血（靜脈血）；肺靜脈流的是含氧血（動脈血）", "肺動脈流的是含氧血；肺靜脈流的是缺氧血", "肺動脈與肺靜脈內流動的均為高氧血液", "肺動脈與肺靜脈內流動的均為缺氧廢血"], "answer": "肺動脈流的是缺氧血（靜脈血）；肺靜脈流的是含氧血（動脈血）", "explanation": "講義筆記第 27 頁（循環系統）：這是一個經典考核陷阱題。人體絕大多數動脈流含氧血、靜脈流缺氧血；但肺循環剛好相反——右心室泵出至肺部的「肺動脈」攜帶全身回流的「缺氧血」去肺部進行氣體交換；經肺部充氧後回流左心房的「肺靜脈」則流著鮮紅的「含氧血」。"}, {"id": "q67", "category": "常見疾病與病理", "page": "講義筆記第 40 頁", "question": "糖尿病病人如果因降糖藥過量或進食過少而引發「急性低血糖反應」，在病人神智清醒狀態下，醫護人員應首要給予甚麼即時處理？", "options": ["立即給予含糖飲料（如果汁、含糖汽水）或 3 至 4 粒糖果進食", "立即要求病人大口深呼吸並平躺喝大量白開水", "立即要求病人再服用多一粒降血糖降壓藥", "立即為病人進行心臟體外心外壓按摩"], "answer": "立即給予含糖飲料（如果汁、含糖汽水）或 3 至 4 粒糖果進食", "explanation": "講義筆記第 40 頁：急性低血糖常見徵狀包括心悸、冒冷汗、手震、飢餓感及頭暈。若病人神智清醒，首要即時給予快速吸收的糖分（如半杯果汁、糖水或糖果）；若病人已昏迷不醒，切忌強行灌水灌糖以防窒息吸入肺部，必須立刻通報醫生進行靜脈注射葡萄糖。"}, {"id": "q68", "category": "常見疾病與病人護理", "page": "講義筆記第 41 頁", "question": "糖尿病患者常伴隨末梢神經病變及下肢循環不良，容易形成「糖尿病足」。指導病人進行日常足部護理時，以下哪一項建議是正確的？", "options": ["每日檢查雙腳有否破損水泡，修剪腳甲時應平剪不可剪得太深或修圓兩角", "為了保持腳部乾爽，應經常赤腳在病房走動", "冬天雙腳冰冷時，應使用高溫熱水袋直接緊貼腳底皮膚取暖", "若腳底長出老繭或雞眼，可用刀片自行在家中削平"], "answer": "每日檢查雙腳有否破損水泡，修剪腳甲時應平剪不可剪得太深或修圓兩角", "explanation": "講義筆記第 41 頁：糖尿病足護理要點：1. 每日以溫水洗腳並用鏡子檢查足底；2. 趾甲橫向平剪，切勿剪破甲溝；3. 嚴禁赤腳行走；4. 末梢感覺遲鈍，切勿用熱水袋直接燙腳防燙傷；5. 雞眼厚繭必須由專業足病診療師 (Podiatrist) 處理。"}, {"id": "q69", "category": "感染控制常識", "page": "講義筆記第 61 - 64 頁", "question": "在醫療院所感染控制中，傳染病的傳播必須具備「感染鏈」(Chain of Infection) 的各個環節。在各個護理防護措施中，被世界衛生組織公認為「最簡單、最經濟而且最有效打破感染鏈」的方法是甚麼？", "options": ["嚴格落實洗手與手部衛生 (Hand Hygiene)", "整天穿著全套重度防護衣物不更換", "每日為所有住院病人預先服用抗生素", "將所有病房門窗緊閉完全不通風"], "answer": "嚴格落實洗手與手部衛生 (Hand Hygiene)", "explanation": "講義筆記第 61 - 64 頁：病原體主要透過醫護人員的雙手在病人與醫療環境之間交叉傳播。嚴格遵守洗手程序（使用肥皂清水或酒精搓手液）是世界衛生組織公認最經濟、最基本且最有效打破接觸傳播感染鏈的核心手段。"}, {"id": "q70", "category": "感染控制常識", "page": "講義筆記第 64 頁", "question": "根據世界衛生組織 (WHO) 推薦的「潔手五大時刻」(5 Moments for Hand Hygiene)，醫護支援人員在以下哪一個情境下必須即時潔手？", "options": ["接觸病人前、執行清潔操作前、接觸體液風險後、接觸病人後、接觸病人周圍環境後", "只有在雙手肉眼見到明顯污漬時才需要洗手", "進入病房簽到時洗一次，整天下班前再洗一次", "戴上手套前不用洗手，戴了手套就永遠不需要洗手"], "answer": "接觸病人前、執行清潔操作前、接觸體液風險後、接觸病人後、接觸病人周圍環境後", "explanation": "講義筆記第 64 頁：潔手五大時刻包括：1. 接觸病人前；2. 執行清潔/無菌操作前；3. 接觸病人體液風險後；4. 接觸病人後；5. 接觸病人周圍環境或物品後。戴手套不能代替洗手，脫手套後亦必須即時潔手。"}, {"id": "q71", "category": "檢驗與樣本收集", "page": "講義筆記第 192 頁", "question": "醫生開立醫囑要求留取病人的「24 小時尿液化驗樣本」(24-hour Urine Collection)，護理人員在指導病人收集尿液時，以下哪一項程序是完全正確的？", "options": ["第一天早上預定開始時的第一次小便排空棄去不留，其後 24 小時內的所有尿液連同第二天早上的第一次小便全部收集", "第一天早上第一次小便必須留取，之後如果病人忘記收集可以略過不補", "只需隨意留取早上、中午和晚上各一杯小便混合即可", "收集期間如果病人排大便，可以連同大便一起混入收集瓶內"], "answer": "第一天早上預定開始時的第一次小便排空棄去不留，其後 24 小時內的所有尿液連同第二天早上的第一次小便全部收集", "explanation": "講義筆記第 192 頁：24 小時尿液收集標準程序：第一天早上開始時（例如上午 7:00），病人必須先排空膀胱並將該次尿液「棄去不留」（因為這是過去夜間積存的尿）；隨後整整 24 小時內每一次排尿均須全數收集於指定大容器內；直到第二天上午同一時間（7:00）的最後一次排尿亦必須全數收集入內。"}, {"id": "q72", "category": "病人護理技巧", "page": "講義筆記第 159 頁", "question": "為神智不清或昏迷的長期臥床病人進行「口腔護理」時，為防止病人誤吸唾液引致吸入性肺炎甚至窒息，護理人員應將病人安置於甚麼體位？", "options": ["側臥位或將病人頭部偏向一側", "平臥仰臥位且頭部不可墊枕頭", "雙腿抬高之休克體位 (Trendelenburg position)", "垂頭仰面向上體位"], "answer": "側臥位或將病人頭部偏向一側", "explanation": "講義筆記第 159 頁：昏迷病人吞嚥反射減弱或消失，平躺容易因口腔分泌物倒流引起氣道梗阻或吸入性肺炎。進行口腔護理時必須採取「側臥位」或將病人「頭部轉向操作者一側」，使分泌物自然引流流出；並且嚴禁將手指伸入病人口中以防咬傷。"}, {"id": "q73", "category": "病人護理技巧", "page": "講義筆記第 159 頁", "question": "在病房為完全臥床病人進行「床上沐浴」(Bed Bath) 時，為符合由乾淨至污染部位的護理衛生原則，清潔順序應該是怎樣的？", "options": ["由眼部及面部開始，經頸、上肢、胸腹、下肢、背部，最後清潔會陰及臀部", "先清潔會陰及臀部，最後才洗面部及眼部", "由腳底開始向上洗至雙腿、胸腹，最後洗頭面部", "不需講究順序，隨意清洗即可"], "answer": "由眼部及面部開始，經頸、上肢、胸腹、下肢、背部，最後清潔會陰及臀部", "explanation": "講義筆記第 159 頁：床上沐浴順序嚴格遵循「由潔至污、自上而下」原則：1. 眼部（由內眥向外眥，每隻眼用獨立乾淨毛巾角）；2. 面部及頸；3. 雙上肢與胸腹；4. 雙下肢；5. 背部與臀部；6. 最後才清洗會陰部及肛周，洗完會陰部必須更換毛巾及水盆。"}, {"id": "q74", "category": "病人護理技巧", "page": "講義筆記第 159 頁", "question": "長期臥床病人因身體重力壓迫骨骼突出部位組織，容易引致局部缺血壞死形成「壓瘡」（褥瘡）。預防壓瘡最基本且最重要的措施是甚麼？", "options": ["至少每 2 小時協助病人轉換體位一次，並保持床單清潔平整無皺褶", "每星期替病人翻身一次即可", "在受壓發紅的皮膚部位用力進行深度按摩", "讓病人長期保持同一睡姿不要隨意挪動"], "answer": "至少每 2 小時協助病人轉換體位一次，並保持床單清潔平整無皺褶", "explanation": "講義筆記第 159 頁：預防壓瘡核心常規：1. 至少每 2 小時協助病人定時翻身轉換體位；2. 保持床鋪平整乾爽無渣屑；3. 骨突處可使用減壓墊或氣墊床；4. 皮膚受壓發紅時切忌用力揉搓按摩，以免加重皮下深層組織剪切傷。"}, {"id": "q75", "category": "生命表徵測量", "page": "講義筆記第 169 頁", "question": "為成年病人進行「直腸肛門探熱」(Rectal Temperature) 時，探熱針插入肛門的深度通常約為多少？", "options": ["約 2.5 至 3 厘米", "約 10 厘米", "約 0.5 厘米", "約 15 厘米"], "answer": "約 2.5 至 3 厘米", "explanation": "講義筆記第 169 頁：直腸探熱法（肛探）是各途徑中最準確反映人體深部核心溫度的測量方法（正常 37.0°C - 38.0°C）。操作時協助病人側臥，探針塗上水溶性潤滑劑，成人插入深度「約為 2.5 至 3 厘米」，並須在測量過程中全程用手固定扶持，切勿放手離開。"}, {"id": "q76", "category": "生命表徵測量", "page": "講義筆記第 169 頁", "question": "使用紅外線耳溫計為成年病人測量耳內溫度時，護理人員拉直耳道以使探頭準確對準耳膜紅外線的正確手法是甚麼？", "options": ["把耳廓向後及向上拉", "把耳廓向前及向下拉", "把耳廓用力向下垂直拉", "不需拉動耳朵，直接塞入耳道即可"], "answer": "把耳廓向後及向上拉", "explanation": "講義筆記第 169 頁：成年人外耳道呈彎曲的「S」形，測量耳溫時必須將「耳廓向後及向上拉直」(Pull pinna back and up)，才能使耳道變直，讓紅外線光束直接感應耳膜（鼓膜）的熱輻射；若是 3 歲以下幼兒則向後及向下拉。"}, {"id": "q77", "category": "生命表徵測量", "page": "講義筆記第 171 頁", "question": "當病房病人突然出現急性呼吸困難、氣喘氣促時，醫護支援人員在即時通報當值護士的同時，應優先協助病人採取甚麼體位以舒緩呼吸？", "options": ["扶病人坐起採取高半坐臥位 (Fowler's position)", "將病人雙腿抬高採取頭低腳高俯臥位", "讓病人完全水平平臥並壓緊胸口", "協助病人彎腰劇烈咳嗽"], "answer": "扶病人坐起採取高半坐臥位 (Fowler's position)", "explanation": "講義筆記第 171 頁：病人呼吸困難時，扶病人坐起（高半坐臥位或端坐位）可利用地心吸力使腹部內臟下降，減輕對橫膈膜的向上壓迫，從而擴大胸腔容積，增加肺活量並改善通氣缺氧情況。"}, {"id": "q78", "category": "生命表徵測量", "page": "講義筆記第 170 頁", "question": "若病人的心律嚴重不齊（如心房顫動），心臟收縮力不均勻，可能導致某些心跳無法傳導至手腕動脈，形成「心尖脈速率大於手腕橈動脈脈率」的現象，此現象在臨床上稱之為甚麼？", "options": ["脈搏短絀 (Pulse Deficit)", "交替脈 (Pulsus Alternans)", "水沖脈 (Water-hammer Pulse)", "奇脈 (Pulsus Paradoxus)"], "answer": "脈搏短絀 (Pulse Deficit)", "explanation": "講義筆記第 170 頁：當心臟搏動微弱不足以產生周圍末梢脈搏時，聽診心尖博動次數會多於橈動脈觸摸次數，差值即為「脈搏短絀」(Pulse Deficit)。測量時通常需由兩名醫護人員同時聽心尖脈及摸橈動脈計時一分鐘對比。"}, {"id": "q79", "category": "病人護理技巧", "page": "講義筆記第 192 頁", "question": "為留置導尿管 (Foley Catheter) 的住院病人翻身或進行床邊活動時，關於集尿袋的位置擺放，以下哪一項是預防逆行尿道感染的絕對原則？", "options": ["集尿袋必須始終保持低於病人的膀胱水平位置", "集尿袋必須放置在病人胸口或床頭高處", "集尿袋必須直接平放在病人肚子上方", "集尿袋高度可以高過膀胱，只要定時排空便可"], "answer": "集尿袋必須始終保持低於病人的膀胱水平位置", "explanation": "講義筆記第 192 頁：集尿袋必須隨時保持「低於膀胱水平」（但不可直接接觸污染地面），以利用重力維持引流通暢，並嚴防積存在尿袋內的尿液逆流倒灌入膀胱引起嚴重的逆行性尿道感染。"}, {"id": "q80", "category": "病房安全與意外處理", "page": "講義筆記第 9 頁", "question": "病房內若不慎打破水銀體溫計導致水銀（汞）散落地面，醫護支援人員協助處理時，以下哪一項做法是「絕對錯誤」的？", "options": ["使用家用吸塵機或普通掃把大力清掃水銀珠", "打開病房窗戶保持空氣流通，並戴上手套進行清理", "使用硬紙片或硬紙板將水銀滴小心聚攏收集", "將收集到的水銀珠放入密封容器並交由專門化學廢物處置"], "answer": "使用家用吸塵機或普通掃把大力清掃水銀珠", "explanation": "講義筆記第 9 頁：水銀在常溫下極易揮發成劇毒汞蒸氣。絕對不可使用吸塵機（熱風會加快水銀蒸發並將有毒汞霧擴散到整個病房）或掃把（會將水銀珠打碎成微粒難以收集）。正確做法是打開門窗通風，戴手套用硬紙片將水銀珠聚攏吸入密閉容器交由化學廢物處理。"}, {"id": "q81", "category": "感染控制與滅菌", "page": "講義筆記第 88 頁", "question": "在醫療感染控制名詞定義中，「滅菌」(Sterilization) 與「消毒」(Disinfection) 之間最根本的區別是甚麼？", "options": ["「滅菌」能殺滅所有微生物包括耐熱的細菌芽胞；而「消毒」只能殺滅大部份致病微生物，不一定能消滅芽胞", "「消毒」的殺菌效果比「滅菌」更徹底、要求更高", "「滅菌」只適用於病房空氣；「消毒」只適用於金屬器械", "兩者在醫療衛生術語上完全同義，沒有任何區別"], "answer": "「滅菌」能殺滅所有微生物包括耐熱的細菌芽胞；而「消毒」只能殺滅大部份致病微生物，不一定能消滅芽胞", "explanation": "講義筆記第 88 頁：滅菌 (Sterilization) 是指徹底殺滅或清除物品上的一切微生物（包括細菌、病毒、真菌及最具耐受性的細菌芽胞）；消毒 (Disinfection) 則是消滅大部份致病微生物，通常無法殺死所有細菌芽胞。"}, {"id": "q82", "category": "屍體料理與病理變化", "page": "講義筆記第 199 頁", "question": "病人離世後，身體會相繼出現各種物理與化學屍體變化，其中「屍僵」(Rigor Mortis) 通常在死後多少小時開始陸續出現？因此護理人員應及時為遺體合上眼睛並合攏下頜？", "options": ["約 2 至 4 小時後開始出現", "約 48 小時後才開始出現", "死後一分鐘即完全僵硬", "死後一星期後出現"], "answer": "約 2 至 4 小時後開始出現", "explanation": "講義筆記第 199 頁：人死後肌肉組織內三磷酸腺苷 (ATP) 耗盡，全身骨骼肌逐漸收縮變硬，形成「屍僵」(Rigor Mortis)，通常於死後 2 至 4 小時開始出現。因此護理人員在病人逝世後應抓緊在屍僵形成前完成遺體合目、閉頜、拔管及擺放自然仰臥體位。"}, {"id": "q83", "category": "屍體料理與病理變化", "page": "講義筆記第 201 頁", "question": "在為已故病人進行遺體料理（最後護理）時，護理人員使用脫脂棉花妥善填塞死者口、鼻及肛門等孔道的首要目的是甚麼？", "options": ["防止體內血液、分泌物及體液從孔道滲漏污染", "使遺體面部顯得更加豐滿紅潤", "加速遺體體溫散發冷卻", "防止死者突然發出聲音"], "answer": "防止體內血液、分泌物及體液從孔道滲漏污染", "explanation": "講義筆記第 201 頁：人死後各孔道括約肌完全鬆弛，體內氣體及液體受壓容易從口、鼻、耳及肛門滲出。填塞棉花能吸收並阻隔分泌物，防止在搬移或運送過程中血液及惡臭體液外溢污染屍袋及床單。"}, {"id": "q84", "category": "舒緩治療與家屬關顧", "page": "講義筆記第 197 頁", "question": "在護理人員為臨終病人家屬提供的「哀傷關顧」(Bereavement Care) 中，以下哪一個時機屬於提供心理支持的重要關鍵節點？", "options": ["通知家屬病人病情轉壞時、正式宣布死訊時以及病人逝世後的心理支持", "只有在病人入院當天需要關顧，病人臨終時不需理會家屬", "宣布死亡後立即請家屬離開醫院，完全不給予宣洩悲傷的空間", "在病人病危時刻意隱瞞家屬，直到離世後數天才發通知"], "answer": "通知家屬病人病情轉壞時、正式宣布死訊時以及病人逝世後的心理支持", "explanation": "講義筆記第 197 頁：護理人員對家屬的哀傷照顧貫穿三個關鍵節點：1. 通知家屬病情急轉直下時；2. 醫生正式向家屬宣布惡噩的一刻；3. 病人死亡後的悲傷宣洩與心理支持。並應提供屏風隔開的私人空間讓家人陪伴道別。"}, {"id": "q85", "category": "病房安全與防跌措施", "page": "講義筆記第 6 頁", "question": "住院長者常因服用鎮靜藥、夜間如廁或虛弱而發生跌倒骨折意外。以下哪一項「不屬於」預防病房病人跌倒的安全措施？", "options": ["將病床升到最高水平以防止病人隨便跨越下床", "病房通道保持暢通無雜物，地面若有水漬立即抹乾", "夜間保持床頭燈或地燈照明，並將叫人鈴放在病人伸手可觸及處", "評估為跌倒高危之病人，臥床時必須拉起兩側床欄"], "answer": "將病床升到最高水平以防止病人隨便跨越下床", "explanation": "講義筆記第 6 頁及第 149 頁：防跌常規要求病人在床上休息時「應將病床降至最低水平」，即使病人不慎滾下床亦能將衝擊傷害減至最低；將床升到最高會大大增加墜床摔傷骨折的致命風險，屬嚴重錯誤操作。"}, {"id": "q86", "category": "病人約束護理原則", "page": "講義筆記第 6 頁", "question": "對於神智混亂、拔除身上輸液管或氣管插管的躁動病人，使用「安全背心」（約束衣）時必須嚴格遵守甚麼護理規範？", "options": ["必須由醫生處方及護士評估指導，定期鬆解約束觀察肢體血液循環與皮膚狀況", "醫護支援人員可隨意自行決定是否替病人穿上約束衣，無須通知護士", "約束帶必須盡量綁得極緊，直到病人手腳完全動彈不得發紫為止", "約束衣穿上後可以連續綁兩天兩夜，期間絕不可解開"], "answer": "必須由醫生處方及護士評估指導，定期鬆解約束觀察肢體血液循環與皮膚狀況", "explanation": "講義筆記第 6 頁及第 18 頁：身體約束 (Physical Restraint) 涉及病人人身自由與尊嚴，必須經醫生處方及護士專業評估；使用期間必須定時巡視，每 2 小時鬆解約束更換體位，密切觀察受約束肢體的末梢循環、皮溫及感覺，嚴防壓傷或神經受損。"}, {"id": "q87", "category": "病房氧氣治療安全", "page": "講義筆記第 24 頁", "question": "病房中正在接受氧氣治療 (Oxygen Therapy) 的病人床位周圍，為防止發生燃爆火災危險，必須嚴格落實以下哪一項安全規定？", "options": ["氧氣治療區域嚴禁吸煙及明火，並避免使用易產生火花的電器", "在氧氣瓶旁邊點燃香薰蠟燭以淨化病房空氣", "將氧氣瓶平放在地上滾動搬運", "為病人塗抹大量油性凡士林在鼻孔周圍以助潤滑"], "answer": "氧氣治療區域嚴禁吸煙及明火，並避免使用易產生火花的電器", "explanation": "講義筆記第 24 頁：氧氣具有極強烈的助燃性質。氧氣治療範圍內「嚴禁吸煙、點燃火柴、蠟燭或任何明火」，不可使用易起火花之設備；且氧氣鼻導管周圍避免使用易燃的油性軟膏（如凡士林），應使用水溶性潤滑劑。"}, {"id": "q88", "category": "人體內分泌系統", "page": "講義筆記第 26 頁", "question": "人體消化系統兼具內分泌功能的胰臟中，專門負責分泌「胰島素」(Insulin) 以降低血液中葡萄糖濃度的細胞群是甚麼？", "options": ["胰島 (Islets of Langerhans)", "甲狀腺濾泡", "腎上腺皮質", "腦垂體前葉"], "answer": "胰島 (Islets of Langerhans)", "explanation": "講義筆記第 26 頁（內分泌系統）：胰臟內的內分泌細胞群稱為「胰島」(Islets of Langerhans)，主要分泌胰島素 (Insulin，降低血糖) 和升糖素 (Glucagon，提升血糖)，維持人體血糖在正常恆定範圍。"}, {"id": "q89", "category": "人體消化系統", "page": "講義筆記第 26 頁", "question": "在人體消化道中，食糜經過胃與小腸消化吸收大部分營養素後，主要負責「吸收多餘水分及電解質、形成並儲存固體糞便」的器官是甚麼？", "options": ["大腸 (Large Intestine / Colon)", "食道 (Oesophagus)", "胃 (Stomach)", "膽囊 (Gallbladder)"], "answer": "大腸 (Large Intestine / Colon)", "explanation": "講義筆記第 26 頁（消化系統）：小腸負責大部分化學消化和營養吸收；「大腸」（包括盲腸、結腸和直腸）的主要生理功能是吸收水分與無機鹽，將未消化的食物殘渣濃縮形成固體糞便，並經直腸排出體外。"}, {"id": "q90", "category": "人體消化與代謝", "page": "講義筆記第 26 頁", "question": "人體內體積最大、代謝最旺盛的內臟器官，具備解毒、製造膽汁、儲存肝醣及合成凝血因子等重要生理功能的器官是甚麼？", "options": ["肝臟 (Liver)", "脾臟 (Spleen)", "腎臟 (Kidney)", "胰臟 (Pancreas)"], "answer": "肝臟 (Liver)", "explanation": "講義筆記第 26 頁：肝臟 (Liver) 是人體最大的實質性腺體器官，功能極其繁多，包括分泌膽汁乳化脂肪、解毒人體內生及外來毒素、合成白蛋白及凝血因子，並參與碳水化合物及脂質代謝平衡。"}, {"id": "q91", "category": "常見心血管疾病", "page": "講義筆記第 27 頁", "question": "當冠狀動脈發生急性粥樣硬化斑塊破裂形成血栓，導致心肌供血中斷引起「急性心肌梗塞」時，病人最典型的胸痛特徵是甚麼？", "options": ["胸骨後壓榨性窒息感劇痛，疼痛可放射至左肩、左臂內側、頸部或下頜", "在深呼吸或咳嗽時右下腹劇烈刺痛", "進食辛辣食物後上腹部微酸隱痛", "雙側腰部呈絞痛並向下腹放射"], "answer": "胸骨後壓榨性窒息感劇痛，疼痛可放射至左肩、左臂內側、頸部或下頜", "explanation": "講義筆記第 27 頁：急性心肌梗塞典型特徵為胸骨後或心前區劇烈的壓榨樣、沉重感疼痛，持續超過 15-30 分鐘，休息或含服硝酸甘油多不能完全緩解，常伴有大汗淋漓、瀕死恐懼感，疼痛常放射至左肩、左上肢尺側及左頸部。"}, {"id": "q92", "category": "神經系統與意識評估", "page": "講義筆記第 16 頁", "question": "急症室及病房中廣泛用於客觀評估頭部創傷、中風或重症病人意識障礙深度的國際評分工具是甚麼？", "options": ["格拉斯哥昏迷評分法 (Glasgow Coma Scale, GCS)", "阿普伽新生兒評分 (Apgar Score)", "諾頓壓瘡風險評分 (Norton Scale)", "疼痛視覺類比量表 (VAS Score)"], "answer": "格拉斯哥昏迷評分法 (Glasgow Coma Scale, GCS)", "explanation": "講義筆記第 16 頁及第 162 頁：格拉斯哥昏迷評分 (GCS) 是國際通用的意識評估量表，從「睜眼反應 (E)」、「言語反應 (V)」及「運動反應 (M)」三個面向評分，滿分為 15 分（完全清醒正常），最低為 3 分（深昏迷）。"}, {"id": "q93", "category": "醫護專業操守與法例", "page": "講義筆記第 10 頁", "question": "在醫療行業行為守則與《個人資料（私隱）條例》要求下，以下哪一種情景屬於醫護人員「嚴重違反病人私隱權」的行為？", "options": ["在下班後將病房某名知名藝人或鄰居病人的診斷及八卦分享到個人社交媒體或與朋友閒聊", "在病房交更時向接更護士詳細匯報病人的生命表徵與引流量", "在醫生查房時向主管醫生如實陳述病人昨夜排便狀況", "在護理記錄表上客觀記錄病人當天進食量"], "answer": "在下班後將病房某名知名藝人或鄰居病人的診斷及八卦分享到個人社交媒體或與朋友閒聊", "explanation": "講義筆記第 10 頁：醫護人員對工作中獲悉的病人一切病情、個人身份資料負有法律與職業道德上的嚴格保密義務。未經授權在社交平台披露、討論甚至傳閱病人資料屬於嚴重違法及違紀行為。"}, {"id": "q94", "category": "生命表徵測量常規", "page": "講義筆記第 166 頁", "question": "護理人員替病人測量血壓時，若被測量者的手臂位置「低於心臟水平」，測得的血壓讀數通常會出現甚麼偏差？", "options": ["測得的血壓讀數會假性偏高", "測得的血壓讀數會假性偏低", "測得的血壓讀數會保持絕對精確不受影響", "水銀柱會完全無法上升"], "answer": "測得的血壓讀數會假性偏高", "explanation": "講義筆記第 166 頁：根據流體靜壓物理原理，當手臂低於心臟水平時，動脈內額外承受血液重力水柱壓力，測得的血壓會「假性偏高」；相反，若手臂高於心臟水平，測得數值則會「假性偏低」。因此測量時手臂必須嚴格保持在心臟水平。"}, {"id": "q95", "category": "醫療廢物分類法規", "page": "講義筆記第 134 頁", "question": "在香港法例《廢物處置（臨床醫療廢物）規例》中，以下哪一類廢物屬於「第 3 組 - 人體和動物組織」？", "options": ["手術切除的器官組織、截肢肢體、胎盤及病理切片標本", "手術用過的手術刀片及縫合針", "病人使用過的一次性尿片及紙巾", "實驗室培養基及培養皿"], "answer": "手術切除的器官組織、截肢肢體、胎盤及病理切片標本", "explanation": "講義筆記第 134 頁：醫療廢物第 3 組明確定義為人體和動物組織（包括切除器官、病理活檢組織、截除之肢體、胎盤等），必須放入黃色專用醫療廢物膠袋並妥善冷凍或標籤後由持牌收集商處置。"}, {"id": "q96", "category": "生命表徵測量常規", "page": "講義筆記第 169 頁", "question": "在評估病人體溫時，成年人「發熱」（發燒 Fever）在臨床醫學上的常規體溫界定標準通常是指體溫超過多少？", "options": ["口探或耳探體溫超過 37.5°C", "體溫超過 36.5°C 即算發燒", "體溫超過 42.0°C 才算發燒", "體溫降到 35.0°C 以下算發燒"], "answer": "口探或耳探體溫超過 37.5°C", "explanation": "講義筆記第 169 頁：正常人體口探及耳探體溫為 36.5°C - 37.5°C。當口探或耳探體溫「高於 37.5°C」（或肛探高於 38.0°C、腋探高於 37.2°C）時，即在臨床上定義為發燒（Pyrexia / Fever）。"}, {"id": "q97", "category": "屍體處理三大類別", "page": "講義筆記第 201 頁", "question": "處理「第 2 類（黃色標籤）」及「第 3 類（紅色標籤）」的傳染病死者遺體時，工作人員穿戴的個人防護裝備 (PPE)，以下哪一項是必須配備的？", "options": ["全套防護衣物（包括保護衣、手套、口罩、帽、鞋套，有飛濺風險時加護目鏡或面罩）", "只需要戴一副普通手套即可，其他不需要", "穿著便服即可，不用戴口罩", "戴上墨鏡及普通毛線手套"], "answer": "全套防護衣物（包括保護衣、手套、口罩、帽、鞋套，有飛濺風險時加護目鏡或面罩）", "explanation": "講義筆記第 201 頁 C(i) 項：處理第 2 類及第 3 類傳染性屍體時，工作人員防護規格提升：必須穿上「全套保護衣物」（包括防水/抗水保護衣、手套、口罩、帽及鞋套），在有液體飛濺風險時須戴護目鏡或面罩保護眼口鼻黏膜。"}, {"id": "q98", "category": "臨終心理反應與照顧", "page": "講義筆記第 196 頁", "question": "庫伯勒-羅斯臨終心理反應的第五階段「接受期」(Acceptance)，臨終病人此時最常見的心理與行為特徵是甚麼？", "options": ["情緒變得相對平靜，接受無法改變的命運，冷靜安排後事或抓緊時間安慰家人", "大聲咆哮並謾罵身邊的醫護人員為什麼醫不好他", "四處尋找民間偏方並深信自己絕對沒有患重病", "對任何人都充滿強烈的敵意與仇恨"], "answer": "情緒變得相對平靜，接受無法改變的命運，冷靜安排後事或抓緊時間安慰家人", "explanation": "講義筆記第 196 頁：接受期 (Acceptance) 的病人深知自己大限將至，內心掙扎逐漸平息，表現出平靜或冷漠，某些積極者甚至會反過來安慰悲傷的家屬，並在精力許可下交代財產分配及身後事宜安排。"}, {"id": "q99", "category": "醫療廢物處理", "page": "講義筆記第 135 頁", "question": "病房更換利器收集盒或綁紮黃色醫療廢物膠袋時，為防止感染性氣體噴出及銳器刺傷，醫護人員應採用哪一種標準封口方法？", "options": ["使用「鵝頸結」緊密摺疊並以封箱膠紙或封條紮緊，切勿用手擠壓袋內空氣", "用力用腳踩踏膠袋將空氣擠扁以便節省空間", "用訂書機或扣針直接釘封膠袋口", "打開袋口隨意丟放在走廊地上"], "answer": "使用「鵝頸結」緊密摺疊並以封箱膠紙或封條紮緊，切勿用手擠壓袋內空氣", "explanation": "講義筆記第 135 頁：醫療廢物袋封口標準手法為「天鵝頸結」(Swan-neck method)，將袋口扭緊並反折後用專用封條紮牢；嚴禁用手或腳擠壓排氣（以免形成氣溶膠噴出吸入感染），且嚴禁使用訂書針或扣針（以免戳破袋子刺傷他人）。"}, {"id": "q100", "category": "醫療架構與專職醫療", "page": "講義筆記第 17 頁", "question": "公立醫院中專門負責協助病人解決因患病引起的家庭、經濟、心理壓力困難，並協助申請醫療費用減免及院舍轉介的專職人員是甚麼？", "options": ["醫務社會工作者 (Medical Social Worker, MSW)", "會計部職員", "病房經理", "社康護士"], "answer": "醫務社會工作者 (Medical Social Worker, MSW)", "explanation": "講義筆記第 17 頁：醫務社會工作者 (M.S.W.) 是跨專業醫療團隊的重要成員，專門評估病人家庭經濟與社會心理狀況，協助申請各類社工福利援助、傷殘津貼、醫療收費豁免以及出院後老人院轉介等社會資源協調。"}];

    // Storage Key for tracking seen question IDs across sessions
    const SEEN_STORAGE_KEY = 'pca_quiz_seen_ids_v2';

    // State
    let currentQuestions = [];
    let userAnswers = {};
    let correctCount = 0;
    let answeredCount = 0;

    function getSeenIds() {
      try {
        const stored = localStorage.getItem(SEEN_STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    }

    function saveSeenIds(ids) {
      try {
        localStorage.setItem(SEEN_STORAGE_KEY, JSON.stringify(ids));
      } catch (e) {}
    }

    function getEligiblePool(selectedFilter) {
      if (selectedFilter === 'all') {
        return [...fullQuestionsBank];
      } else if (selectedFilter === 'hospice_corpse') {
        return fullQuestionsBank.filter(q => 
          q.category.includes('屍體') || q.category.includes('臨終') || q.category.includes('舒緩')
        );
      } else if (selectedFilter === 'vitals_care') {
        return fullQuestionsBank.filter(q => 
          q.category.includes('生命表徵') || q.category.includes('檢查') || q.category.includes('病人護理') || q.category.includes('檢驗')
        );
      } else if (selectedFilter === 'infection_waste') {
        return fullQuestionsBank.filter(q => 
          q.category.includes('消毒') || q.category.includes('感染') || q.category.includes('廢物') || q.category.includes('衛生') || q.category.includes('職安') || q.category.includes('滅菌')
        );
      } else if (selectedFilter === 'diseases_systems') {
        return fullQuestionsBank.filter(q => 
          q.category.includes('疾病') || q.category.includes('系統') || q.category.includes('結構') || q.category.includes('感覺') || q.category.includes('心血管') || q.category.includes('代謝') || q.category.includes('消化') || q.category.includes('內分泌') || q.category.includes('意識')
        );
      } else if (selectedFilter === 'roles_terms') {
        return fullQuestionsBank.filter(q => 
          q.category.includes('職責') || q.category.includes('縮寫') || q.category.includes('術語') || q.category.includes('專職') || q.category.includes('體系') || q.category.includes('操守') || q.category.includes('安全')
        );
      }
      return [...fullQuestionsBank];
    }

    // Smart Non-Repeating Random Generation Logic
    function generateQuiz() {
      const selectedFilter = document.getElementById('topic-filter').value;
      userAnswers = {};
      correctCount = 0;
      answeredCount = 0;
      updateScoreUI();

      const pool = getEligiblePool(selectedFilter);
      let seenIds = getSeenIds();

      // Separate eligible questions into unseen vs seen
      const unseenQuestions = pool.filter(q => !seenIds.includes(q.id));
      const seenQuestions = pool.filter(q => seenIds.includes(q.id));

      // Sort seenQuestions by the order they were recorded in seenIds (Least Recently Used first)
      seenQuestions.sort((a, b) => seenIds.indexOf(a.id) - seenIds.indexOf(b.id));

      let selectedBatch = [];
      let statusNotice = '';

      if (unseenQuestions.length >= 20) {
        // Case 1: Plentiful unseen questions -> 100% brand new questions! 0% repetition!
        shuffleArray(unseenQuestions);
        selectedBatch = unseenQuestions.slice(0, 20);
        
        // Record these 20 into seenIds
        selectedBatch.forEach(q => seenIds.push(q.id));
        saveSeenIds(seenIds);

        const remainingUnseen = unseenQuestions.length - 20;
        statusNotice = `本輪抽題：20 題均為全新題目 (0% 重複) ｜ 該範疇尚餘 ${remainingUnseen} 條未做新題`;
      } else if (unseenQuestions.length > 0) {
        // Case 2: Some unseen questions left (e.g. 5), but less than 20
        shuffleArray(unseenQuestions);
        selectedBatch = [...unseenQuestions];
        const needed = 20 - selectedBatch.length;

        // Take from the least recently seen questions
        const reusedBatch = seenQuestions.slice(0, needed);
        selectedBatch = selectedBatch.concat(reusedBatch);

        // Update seenIds: add the new ones, move reused to the back
        unseenQuestions.forEach(q => seenIds.push(q.id));
        reusedBatch.forEach(q => {
          const idx = seenIds.indexOf(q.id);
          if (idx !== -1) seenIds.splice(idx, 1);
          seenIds.push(q.id);
        });
        saveSeenIds(seenIds);

        statusNotice = `本輪包含 ${unseenQuestions.length} 條新題及 ${needed} 條最久未出現之複習題 ｜ 題庫即將完成一輪！`;
      } else {
        // Case 3: All questions in this pool have been completed!
        // Reset seenIds for this pool so user starts a fresh round, pulling from oldest
        const poolIds = pool.map(q => q.id);
        seenIds = seenIds.filter(id => !poolIds.includes(id));

        // Take first 20 from seenQuestions (the ones seen longest ago)
        selectedBatch = seenQuestions.slice(0, 20);
        selectedBatch.forEach(q => seenIds.push(q.id));
        saveSeenIds(seenIds);

        statusNotice = `該範疇題目已全部做完一輪！系統已自動為你開啟新循環（優先選取最久未出之題目）`;
      }

      currentQuestions = selectedBatch;
      document.getElementById('queue-status-text').textContent = statusNotice;

      renderQuizUI();
    }

    function renderQuizUI() {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';

      currentQuestions.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${qIndex}`;

        const letters = ['A', 'B', 'C', 'D'];

        // Shuffle options for extra variability while tracking correct answer text
        const shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);

        let optionsHtml = '';
        shuffledOptions.forEach((opt, optIndex) => {
          optionsHtml += `
            <button class="option-btn" id="btn-opt-${qIndex}-${optIndex}" onclick="selectAnswer(${qIndex}, ${optIndex}, '${opt.replace(/'/g, "\'")}')">
              <span class="option-letter">${letters[optIndex]}</span>
              <span>${opt}</span>
            </button>
          `;
        });

        card.innerHTML = `
          <div class="question-header">
            <div class="question-badge-num">${qIndex + 1}</div>
            <div class="question-info">
              <div class="meta-tags-row">
                <span class="page-tag">來源：${q.page}</span>
                <span class="category-tag">${q.category}</span>
              </div>
              <div class="question-stem">${q.question}</div>
            </div>
          </div>

          <div class="options-grid">
            ${optionsHtml}
          </div>

          <div class="explanation-box" id="explanation-${qIndex}">
            <div class="explanation-result-title" id="explanation-title-${qIndex}"></div>
            <div class="explanation-detail">${q.explanation}</div>
            <div class="explanation-page-callout">講義筆記底部頁數出處：${q.page}</div>
          </div>
        `;

        container.appendChild(card);
      });

      document.getElementById('bottom-summary-text').textContent = '請完成上方 20 條題目後，可在此查看成績並換一批題目繼續練習。';
    }

    function selectAnswer(qIndex, optIndex, selectedValue) {
      if (userAnswers[qIndex] !== undefined) return; // already answered

      userAnswers[qIndex] = selectedValue;
      answeredCount++;

      const q = currentQuestions[qIndex];
      const isCorrect = (selectedValue === q.answer);

      if (isCorrect) correctCount++;
      updateScoreUI();

      // Style options
      const card = document.getElementById(`q-card-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        const optText = btn.querySelector('span:nth-child(2)').textContent;

        if (optText === q.answer) {
          if (idx === optIndex) {
            btn.classList.add('selected-correct');
          } else {
            btn.classList.add('reveal-correct');
          }
        } else if (idx === optIndex && !isCorrect) {
          btn.classList.add('selected-wrong');
        }
      });

      // Show detailed explanation
      const expBox = document.getElementById(`explanation-${qIndex}`);
      const expTitle = document.getElementById(`explanation-title-${qIndex}`);

      expBox.style.display = 'block';
      if (isCorrect) {
        expBox.className = 'explanation-box correct';
        expTitle.textContent = '答啱咗！答案完全正確！';
      } else {
        expBox.className = 'explanation-box wrong';
        expTitle.textContent = `答錯咗，請再記一記！正確答案係：【${q.answer}】`;
      }

      // Check if all 20 are answered
      if (answeredCount === 20) {
        const pct = Math.round((correctCount / 20) * 100);
        let evaluation = '';
        if (pct >= 90) evaluation = '成績非常優異！所有核心概念掌握得好紮實！';
        else if (pct >= 75) evaluation = '成績良好！答錯既題目建議翻查對應既講義頁數加深記憶！';
        else evaluation = '仍有提升空間，建議針對答錯既章節講義頁數多加重溫！';

        document.getElementById('bottom-summary-text').innerHTML = `
          <strong>本次測驗完成！最終得分：${correctCount} / 20 (正答率: ${pct}%)</strong><br>
          <span style="font-size: 0.9rem; color: #475569;">${evaluation}</span>
        `;
      }
    }

    function updateScoreUI() {
      const topScore = document.getElementById('top-score-display');
      if (answeredCount === 0) {
        topScore.textContent = '0 / 0 (0%)';
      } else {
        const pct = Math.round((correctCount / answeredCount) * 100);
        topScore.textContent = `已答 ${answeredCount} / 20 題 ｜ 正答率: ${pct}% (得分: ${correctCount})`;
      }
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Document Ready
    document.addEventListener('DOMContentLoaded', () => {
      generateQuiz();

      // Topic filter change
      document.getElementById('topic-filter').addEventListener('change', () => {
        generateQuiz();
      });

      // Bottom refresh button
      document.getElementById('btn-refresh-quiz-bottom').addEventListener('click', () => {
        generateQuiz();
        // Smoothly scroll back to the top of the container
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // Reset queue history button
      document.getElementById('btn-reset-history').addEventListener('click', () => {
        if (confirm('確定要清除題庫抽題歷史記錄嗎？清除後將重新開始第一輪抽題。')) {
          localStorage.removeItem(SEEN_STORAGE_KEY);
          generateQuiz();
        }
      });
    });
  </script>
</body>
</html>
